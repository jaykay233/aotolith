name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Ruff only needs a source tree, so this runs on the cheap Linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check src tests examples

  test:
    # Backends here emit Metal, so the suite needs an Apple Silicon runner.
    #
    # Those runners are virtualised, and their GPU is an "Apple Paravirtual
    # device": it reports `__HAVE_TENSOR__` and then refuses to load the
    # tensor-core kernels with "unsupported deferred-static-alloca-size function
    # body". `compile` catches that by loading a real kernel and re-lowering
    # without tensor cores, so plans here are valid but simdgroup-only. Tests
    # that assert tensor-core source skip themselves for that reason, which is
    # why `-rs` matters — a green run on this runner does not cover the
    # tensor-core paths, only the ones every GPU takes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package the way a user would
        # An editable install of the dev extra, rather than a bare `pip install
        # pytest`, so the wheel metadata and package layout are exercised too.
        run: pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest -rs
      - name: Run the Llama example end to end
        # Exercises the path a user takes — HuggingFace module, capture,
        # lowering, execution — and fails if the logits drift past 1e-4.
        run: python examples/tiny_llama_compile.py
      - name: Confirm the distribution builds
        run: python -m build
