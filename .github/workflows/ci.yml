name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Ruff only needs a source tree, so this runs on the cheap Linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check src tests examples

  types:
    # Pyright needs the packages it checks against, and MLX has wheels for
    # macOS only - so this runs on an Apple runner rather than the cheap Linux
    # one the linter uses. The scope is `pyrightconfig.json`: the public surface
    # (entry points, errors, artifact, plan) is checked strictly, and the
    # numerical kernels are not yet. Widening that list is how typing coverage
    # grows; the gate is "zero errors in what is listed", not "zero somewhere".
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Type-check the public surface
        run: pyright

  test:
    # Backends here emit Metal, so the suite needs an Apple Silicon runner.
    #
    # Those runners are virtualised, and their GPU is an "Apple Paravirtual
    # device": it reports `__HAVE_TENSOR__` and then refuses to load the
    # tensor-core kernels with "unsupported deferred-static-alloca-size function
    # body". `compile` catches that by loading a real kernel and re-lowering
    # without tensor cores, so plans here are valid but simdgroup-only. Tests
    # that assert tensor-core source skip themselves for that reason, which is
    # why `-rs` matters — a green run on this runner does not cover the
    # tensor-core paths, only the ones every GPU takes.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # `requires-python` claims 3.11, so test it rather than assume it. The
        # later interpreters are the ones MLX 0.32 and Torch 2.15 both ship
        # wheels for; a new one joins this list only once they do, because a
        # resolver failure says nothing about this package.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package the way a user would
        # An editable install of the dev extra, rather than a bare `pip install
        # pytest`, so the wheel metadata and package layout are exercised too.
        run: pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest -rs
      - name: Enforce the coverage floor
        # Measured from `src/`, with the floor in `[tool.coverage.report]`.
        # `coverage run -m pytest` rather than `pytest --cov` keeps this working
        # in an environment that installed only the dev extra.
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - name: Run the Llama example end to end
        # Exercises the path a user takes — HuggingFace module, capture,
        # lowering, execution — and fails if the logits drift past 1e-4.
        run: python examples/tiny_llama_compile.py
      - name: Confirm the distribution builds
        run: python -m build
      - name: Install the wheel as a user would
        # The editable install above has the `dev` extra, so it can mask a
        # dependency the package never declared — which is exactly how `numpy`
        # went missing from a plain `pip install aotolith` while the suite
        # stayed green. So: install the built wheel into a bare venv, import the
        # core package, run the console script, and assert the metadata still
        # declares the dependencies and extras we mean to ship.
        #
        # `aotolith.models.qwen2` is deliberately not imported here: it needs
        # torch, which is the `hf` extra's job, and the assertion below is what
        # checks that the extra is declared.
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import aotolith, aotolith.models, aotolith.cli"
          /tmp/wheel-check/bin/aoto --help > /dev/null
          /tmp/wheel-check/bin/python - <<'PY'
          import importlib.metadata as metadata

          requires = metadata.requires("aotolith")
          assert any(r.startswith("numpy") for r in requires), requires
          assert any("torch" in r and "extra == 'hf'" in r for r in requires), requires
          assert any("extra == 'fx'" in r for r in requires), requires
          PY

  bench:
    # A regression gate, not a scoreboard. The deterministic half compares the
    # front-end and mid-end op counts against the recorded baseline, which holds
    # on any machine. The timing and kernel-count half only fires on the
    # baseline's own GPU, so this job compares counts here and leaves the
    # millisecond gate to the machine the baseline came from.
    #
    # ``benchmarks/baselines`` is a chip matrix: one file per chip, named by the
    # chip. On this runner there is no file for the paravirtual GPU, so the gate
    # picks another chip's file and, as ``compare`` reports, gates the op counts
    # and the planned peak but not the milliseconds. When a self-hosted M-series
    # runner records a baseline, that job gated the same way gets the strict half
    # for free - no workflow change, because the lookup is by device.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate the baseline matrix
        # The files are committed and hand-editable, so the things that break by
        # hand - a stale schema, a file renamed away from the chip it records, a
        # chip recorded twice - are checked before anything is measured. This
        # needs no GPU and no matching hardware.
        run: aoto bench --check-baselines benchmarks/baselines
      - name: Check the compiler against the recorded baseline
        # Three rounds on each side: the gate compares best-case floors, and a
        # single round of eleven samples put the same 0.6 ms decode plan
        # anywhere between 0.58 and 0.75 ms on the machine the baseline came
        # from. The extra rounds are what make the floor comparable, and they
        # cost a few seconds.
        run: aoto bench --rounds 3 --baseline benchmarks/baselines --output perf-report.json
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report.json

  real-device-gate:
    # The half of the gate that cannot run on a shared runner: real M-series
    # silicon, where the recorded milliseconds are comparable and the
    # tensor-core kernels actually load. Enabled by setting the repository
    # variable AOTOLITH_SELF_HOSTED_RUNNER to "true" once a runner with the
    # ``m-series`` label is registered; until then it is skipped, not failed, so
    # a fork and a fresh clone still get green checks.
    if: vars.AOTOLITH_SELF_HOSTED_RUNNER == 'true'
    runs-on: [self-hosted, macos, arm64, m-series]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate the baseline matrix
        run: aoto bench --check-baselines benchmarks/baselines
      - name: Gate this chip against its own recorded baseline
        # The directory resolves to this machine's file, so the timing half
        # runs whenever somebody has recorded here. A chip with no recorded
        # file still gates the deterministic half and prints why it did not
        # gate the rest, which is a pass with a note rather than a silent pass.
        run: aoto bench --rounds 3 --baseline benchmarks/baselines --output perf-report.json
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-real-device
          path: perf-report.json
