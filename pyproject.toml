[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aotolith"
version = "0.62.0"
description = "An Apple Metal-first compiler for Transformer models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "jaykay233" }]
dependencies = [
  "mlx>=0.32,<0.33",
]

[project.urls]
Homepage = "https://github.com/jaykay233/aotolith"
Repository = "https://github.com/jaykay233/aotolith"
Issues = "https://github.com/jaykay233/aotolith/issues"

[project.scripts]
aoto = "aotolith.cli:main"

[project.optional-dependencies]
fx = ["torch>=2.7"]
hf = ["torch>=2.7", "transformers>=4.57,<5"]
dev = ["build>=1.2", "pytest>=8", "torch>=2.7", "transformers>=4.57,<5", "ruff>=0.17,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/aotolith"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# `.venv-mlx-only` is a second environment used to check the MLX-only install
# path, and it is not in Ruff's default exclude list.
extend-exclude = [".venv-mlx-only", "dist", "build"]
line-length = 88

[tool.ruff.lint]
# Pyflakes plus syntax errors: the subset that finds broken code rather than
# disagreeing about formatting. It is what caught an undefined `Callable` in a
# postponed annotation and several locals that were computed and never used.
select = ["F", "E9"]
