[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transformer-subgraph-compiler"
version = "0.61.0"
description = "An Apple Metal-first compiler for Transformer models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "jaykay233" }]
dependencies = [
  "mlx>=0.32,<0.33",
]

[project.scripts]
tsc = "transformer_subgraph_compiler.cli:main"

[project.optional-dependencies]
fx = ["torch>=2.7"]
hf = ["torch>=2.7", "transformers>=4.57,<5"]
dev = ["build>=1.2", "pytest>=8", "torch>=2.7", "transformers>=4.57,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/transformer_subgraph_compiler"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
