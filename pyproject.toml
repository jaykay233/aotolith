[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aotolith"
# One source of truth. The version used to be written here and in
# `src/aotolith/_version.py`, which is two places to forget; `hatch` reads the
# module so `importlib.metadata.version("aotolith")` and
# `aotolith.__version__` cannot disagree.
dynamic = ["version"]
description = "An Apple Metal-first compiler for Transformer models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jaykay233" }]
keywords = [
  "compiler",
  "metal",
  "apple-silicon",
  "transformer",
  "inference",
  "mlx",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dependencies = [
  # `quantize.py` and the Qwen2 adapter use numpy at import time, and `mlx`
  # does not depend on it outside its own dev extra, so a plain
  # `pip install aotolith` needs this stated here.
  "numpy>=1.26",
  # MLX ships wheels for macOS arm64 only. Declaring the same condition as a
  # marker keeps a Linux or Intel install from failing at resolution time with
  # "No matching distribution found for mlx", which says nothing about the real
  # requirement; `aotolith/__init__.py` then explains it at import.
  "mlx>=0.32,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/jaykay233/aotolith"
Repository = "https://github.com/jaykay233/aotolith"
Issues = "https://github.com/jaykay233/aotolith/issues"
Documentation = "https://github.com/jaykay233/aotolith/tree/main/docs"
Changelog = "https://github.com/jaykay233/aotolith/blob/main/CHANGELOG.md"

[project.scripts]
aoto = "aotolith.cli:main"

[project.optional-dependencies]
fx = ["torch>=2.7"]
hf = ["torch>=2.7", "transformers>=4.57,<5"]
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "pyright>=1.1.400",
  "pytest>=8",
  "torch>=2.7",
  "transformers>=4.57,<5",
  "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aotolith"]

[tool.hatch.version]
path = "src/aotolith/_version.py"

[tool.hatch.build.targets.sdist]
# A source distribution should be enough to run the suite and the examples:
# the READMEs are what the PyPI page renders, docs/ is where they link, and
# benchmarks/ holds the baseline `aoto bench` compares against.
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/benchmarks",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
# Line coverage over the package, measured from the source tree so a test that
# imports an installed copy cannot hide an uncovered module.
source = ["src/aotolith"]

[tool.coverage.report]
# A ratchet, not an aspiration: the suite sits at ~85%, so the gate is set
# just under it. Raising this number is how coverage improves - a change that
# drops it fails CI instead of quietly becoming the new normal.
fail_under = 84
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
# `.venv-mlx-only` is a second environment used to check the MLX-only install
# path, and it is not in Ruff's default exclude list.
extend-exclude = [".venv-mlx-only", "dist", "build"]
line-length = 88

[tool.ruff.lint]
# Pyflakes plus syntax errors: the subset that finds broken code rather than
# disagreeing about formatting. It is what caught an undefined `Callable` in a
# postponed annotation and several locals that were computed and never used.
select = ["F", "E9"]
